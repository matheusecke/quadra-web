name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t quadra-web .

  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: quadra-web-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      DEPLOY_ROLE_ARN: arn:aws:iam::141145164743:role/quadra-production-web-deploy-role
      S3_BUCKET: quadra-production-frontend-141145164743
      FRONTEND_DOMAIN: appquadra.com.br
      PUBLIC_URL: https://appquadra.com.br
      VITE_API_URL: https://api.appquadra.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve CloudFront distribution
        id: distribution
        run: |
          id="$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(Aliases.Items, '$FRONTEND_DOMAIN')].Id | [0]" \
            --output text)"
          if [ -z "$id" ] || [ "$id" = 'None' ]; then
            echo "No CloudFront distribution serves $FRONTEND_DOMAIN."
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Publish build to S3
        run: |
          # Hashed bundles first and cached forever: the new index.html must never
          # reference an asset that is not in the bucket yet.
          aws s3 sync dist/assets/ "s3://$S3_BUCKET/assets/" \
            --cache-control 'public, max-age=31536000, immutable'
          # index.html and the static public files keep their names between
          # releases, so they are revalidated on every request.
          aws s3 sync dist/ "s3://$S3_BUCKET/" \
            --delete \
            --exclude 'assets/*' \
            --cache-control 'no-cache'

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.distribution.outputs.id }}" \
            --paths '/*' \
            --query 'Invalidation.Status' \
            --output text

      - name: Verify public frontend
        run: |
          if ! http_status="$(curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            "$PUBLIC_URL")"; then
            echo 'Public frontend request failed.'
            exit 1
          fi
          echo "Public frontend returned HTTP $http_status."
          test "$http_status" = '200'
